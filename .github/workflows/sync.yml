name: Sincronizar Paletes

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Instalar dependências
        run: npm install
      
      - name: Sincronizar Google Sheets
        run: node index.js sync
        env:
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      
      - name: Commit e Push
        run: |
          git config --local user.email "bot@lle.com"
          git config --local user.name "LLE Bot"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: atualizar dados" && git push)
